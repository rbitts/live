[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "openweight-live"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.128,<1", "uvicorn>=0.40,<1", "httpx>=0.28,<1", "websockets>=16,<17", "numpy>=2,<3", "pillow>=11,<13", "huggingface-hub>=0.36,<3"]
[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
